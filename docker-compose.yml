services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pqrs_postgres
    environment:
      POSTGRES_DB: pqrs_saas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pqrs_saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqrs_api
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=pqrs_saas_db;Username=postgres;Password=postgres
      - Jwt__Secret=SuperSecretKey_For_PQRS_SaaS_Platform_1234567890!
      - Jwt__Issuer=PqrsApi
      - Jwt__Audience=PqrsWidget
      - GEMINI_API_KEY=${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY}
      - AI__Provider=gemini
      - AI__ApiKey=${GEMINI_API_KEY:-YOUR_GEMINI_API_KEY}
      - AI__ChatModel=gemini-3.5-flash
      - AI__EmbeddingModel=text-embedding-004
      - Rag__SimilarityThreshold=0.78
      - Rag__TopK=5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
